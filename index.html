<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-THAILAND 18週年慶抽大獎</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #1a1a1a; color: #f1f1f1; padding: 20px; margin: 0; }
        .container { max-width: 480px; margin: 40px auto; background: #262626; padding: 30px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); border: 1px solid #3d3d3d; }
        h1 { color: #d4af37; font-size: 24px; margin-bottom: 5px; }
        .subtitle { color: #aaa; font-size: 14px; margin-bottom: 25px; }
        input { width: 85%; padding: 12px; margin: 10px 0; font-size: 16px; border-radius: 8px; border: 1px solid #444; background: #111; color: #fff; text-align: center; letter-spacing: 2px; }
        button { width: 90%; padding: 14px; margin: 12px 0; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; }
        #unlockBtn { background: #d4af37; color: #111; }
        #spinBtn { background: #e67e22; color: #fff; }
        #spinBtn:disabled { background: #444; color: #777; cursor: not-allowed; }
        .status { color: #ffcc00; font-size: 14px; margin: 15px 0; min-height: 20px; }
        .reward-box { display: none; background: linear-gradient(135deg, #b8860b, #d4af37); color: #000; padding: 20px; border-radius: 10px; margin-top: 25px; font-weight: bold; box-shadow: 0 4px 15px rgba(212,175,55,0.4); }
        .verify-text { font-size: 12px; color: #333; margin-top: 10px; border-top: 1px dashed #666; padding-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎁 A-THAILAND 18週年慶抽大獎 🎁</h1>
    <div class="subtitle">10 大好禮・即抽即中 / ของรางวัล 10 อย่าง จับสลากได้ทันที</div>
    
    <input type="text" id="luckCode" placeholder="請輸入您的 5 位數抽獎邀請碼" maxlength="5">
    <button id="unlockBtn" onclick="verifyAndUnlock()">確認解鎖轉盤 (ยืนยันเพื่อปลดล็อค)</button>
    
    <button id="spinBtn" onclick="startDraw()" disabled>抽獎 (หมุน)</button>
    <div id="statusText" class="status"></div>
    
    <div id="rewardBox" class="reward-box">
        <h2>🥳 恭喜您中獎了！ ยินดีด้วย!</h2>
        <div id="prizeName" style="font-size: 24px; padding: 10px 0;"></div>
        <div class="verify-text">※ 本活動為購買達標顧客限定，請將中獎畫面出示給店員以利兌獎核銷。</div>
    </div>
</div>

<script>
    const gasApiUrl = "https://google.com";
    
    const prizeList = [
        "Redmi Headphone Neo (藍芽耳機罩)",
        "xdobo X8 II Bluetooth Speaker (喇叭X8二代)",
        "Xiaomi Bluetooth Speaker Essential (小米藍芽喇叭)",
        "Xiaomi Power Bank 10000 22.5W Lite (小米行動電源)",
        "Ronever Travel Speaker IPX4 Waterproof (羅納多喇叭)",
        "ANC Wireless Earbuds (藍芽耳機入耳)",
        "G'FIVE Wireless Power Bank QC3.0+PD (G'FIVE行動電源)",
        "REMAX RPP-145 10000mAh (REMAX行動電源)",
        "卡通造型行動電源 10000mAh",
        "ANFAST Small in Size Big in Power 5000mAh+ (UPS行動電源)"
    ];

    let currentVerifiedCode = "";

    // 💡 終極 JSONP 發送工具：真正能打破網域限制，讀取 Google 的回傳狀態
    function sendJsonp(url, params, callbackName) {
        // 先移除舊的 script 標籤
        const oldScript = document.getElementById("jsonp-script");
        if (oldScript) oldScript.remove();

        let queryString = `?callback=${callbackName}`;
        for (let key in params) {
            queryString += `&${key}=${encodeURIComponent(params[key])}`;
        }
        
        const script = document.createElement("script");
        script.id = "jsonp-script";
        script.src = url + queryString;
        document.body.appendChild(script);
    }

    // 1. 點擊解鎖：這一次網頁會真正等待 Google 檢查有沒有這組邀請碼
    function verifyAndUnlock() {
        const codeInput = document.getElementById("luckCode").value.trim();
        if (codeInput.length !== 5) {
            alert("請輸入正確的 5 位數抽獎邀請碼！");
            return;
        }
        
        document.getElementById("statusText").innerText = "雲端安全連線中，請稍候... (กำลังตรวจสอบ...)";
        document.getElementById("unlockBtn").disabled = true;

        // 全域對接函式：讓 Google 的回應可以直接觸發這裡
        window.handleVerifyResponse = function(response) {
            document.getElementById("unlockBtn").disabled = false;
            
            // 真正抓取 Google 判定的狀態！
            if (response.status === "success" || response.status === "valid" || response.updated_row) {
                currentVerifiedCode = codeInput;
                document.getElementById("spinBtn").disabled = false;
                document.getElementById("statusText").innerText = "✅ 驗證成功！請點擊【抽獎】按鈕！";
                document.getElementById("luckCode").disabled = true;
            } else if (response.status === "used") {
                document.getElementById("statusText").innerText = "❌ 此邀請碼已被使用過！";
                alert("此邀請碼已經抽過獎囉！");
            } else {
                document.getElementById("statusText").innerText = `❌ 驗證失敗：試算表中找不到邀請碼 【${codeInput}】`;
                alert(`錯誤：您的試算表中目前沒有【${codeInput}】這組邀請碼，請店員先點按鈕生成！`);
            }
        };

        // 發送帶有 callback 的請求
        sendJsonp(gasApiUrl, { code: codeInput }, "handleVerifyResponse");
    }

    // 2. 抽獎
    function startDraw() {
        document.getElementById("spinBtn").disabled = true;
        document.getElementById("statusText").innerText = "轉盤旋轉中... (กำลังสุ่มรางวัล...)";
        
        const randomIndex = Math.floor(Math.random() * prizeList.length);
        const finalPrize = prizeList[randomIndex];

        setTimeout(() => {
            document.getElementById("prizeName").innerText = "【" + finalPrize + "】";
            document.getElementById("rewardBox").style.display = "block";
            document.getElementById("statusText").innerText = "🎉 抽獎完成！正在回填至雲端試算表...";
            
            // 執行回填
            submitDrawResult(currentVerifiedCode, finalPrize);
        }, 2000);
    }

    // 3. 回填：真正看得到有沒有成功寫入格子
    function submitDrawResult(code, prize) {
        window.handleSubmitResponse = function(response) {
            if (response.status === "success") {
                document.getElementById("statusText").innerText = "🎉 紀錄已完美同步至雲端試算表（已使用）！";
                console.log("試算表回填確定成功，位於第 " + response.updated_row + " 列！");
            } else {
                document.getElementById("statusText").innerText = `❌ 回填失敗，錯誤原因：${response.status}`;
            }
        };

        sendJsonp(gasApiUrl, { code: code, prize: prize }, "handleSubmitResponse");
    }
</script>

</body>
</html>
