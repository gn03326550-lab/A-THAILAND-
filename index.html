<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-THAILAND 18週年慶抽大獎</title>
    <style>
        /* 網頁整體奢華黑金視覺樣式 */
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            text-align: center; 
            background-color: #1a1a1a; 
            color: #f1f1f1; 
            padding: 20px; 
            margin: 0;
        }
        .container { 
            max-width: 480px; 
            margin: 40px auto; 
            background: #262626; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.6); 
            border: 1px solid #3d3d3d;
        }
        h1 { color: #d4af37; font-size: 24px; margin-bottom: 5px; }
        .subtitle { color: #aaa; font-size: 14px; margin-bottom: 25px; }
        
        /* 輸入框與按鈕設計 */
        input { 
            width: 85%; 
            padding: 12px; 
            margin: 10px 0; 
            font-size: 16px; 
            border-radius: 8px; 
            border: 1px solid #444; 
            background: #111; 
            color: #fff; 
            text-align: center; 
            letter-spacing: 2px;
        }
        input:focus { border-color: #d4af37; outline: none; }
        
        button { 
            width: 90%; 
            padding: 14px; 
            margin: 12px 0; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 8px; 
            border: none; 
            cursor: pointer; 
            transition: all 0.3s ease;
        }
        #unlockBtn { background: #d4af37; color: #111; }
        #unlockBtn:hover { background: #f3ca40; }
        
        #spinBtn { background: #e67e22; color: #fff; }
        #spinBtn:hover { background: #d35400; }
        #spinBtn:disabled { background: #444; color: #777; cursor: not-allowed; }
        
        /* 狀態提示 */
        .status { color: #ffcc00; font-size: 14px; margin: 15px 0; min-height: 20px; }
        
        /* 中獎彈窗區塊 */
        .reward-box { 
            display: none; 
            background: linear-gradient(135deg, #b8860b, #d4af37); 
            color: #000; 
            padding: 20px; 
            border-radius: 10px; 
            margin-top: 25px; 
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(212,175,55,0.4);
        }
        .reward-box h2 { margin: 0 0 10px 0; font-size: 22px; }
        .verify-text { font-size: 12px; color: #333; margin-top: 10px; border-top: 1px dashed #666; padding-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎁 A-THAILAND 18週年慶抽大獎 🎁</h1>
    <div class="subtitle">10 大好禮・即抽即中 / ของรางวัล 10 อย่าง จับสลากได้ทันที</div>
    
    <!-- 邀請碼輸入區 -->
    <input type="text" id="luckCode" placeholder="請輸入您的 5 位數抽獎邀請碼" maxlength="5">
    <button id="unlockBtn" onclick="verifyAndUnlock()">確認解鎖轉盤 (ยืนยันเพื่อปลดล็อค)</button>
    
    <!-- 抽獎按鈕 -->
    <button id="spinBtn" onclick="startDraw()" disabled>抽獎 (หมุน)</button>
    
    <!-- 連線與進度提示 -->
    <div id="statusText" class="status"></div>
    
    <!-- 中獎結果顯示 -->
    <div id="rewardBox" class="reward-box">
        <h2>🥳 恭喜您中獎了！ ยินดีด้วย!</h2>
        <div id="prizeName" style="font-size: 24px; padding: 10px 0;"></div>
        <div class="verify-text">※ 本活動為購買達標顧客限定，請將中獎畫面出示給店員以利兌獎核銷。<br>※ โปรดแสดงหน้าจอนนี้ให้พนักงานดูเพื่อรับรางวัล</div>
    </div>
</div>
<script>
    // 🔗 您的專屬 Google Apps Script API 網址（已整合）
    const gasApiUrl = "https://google.com";
    
    // 🎁 獎項對應清單：請依據您 Stock 工作表中的 1~10 號依序填入真實獎品名稱！
    const prizeList = [
        "獎項 1 商品名稱",
        "獎項 2 商品名稱",
        "獎項 3 商品名稱",
        "獎項 4 商品名稱",
        "獎項 5 商品名稱",
        "獎項 6 商品名稱",
        "獎項 7 商品名稱",
        "獎項 8 商品名稱",
        "獎項 9 商品名稱",
        "獎項 10 商品名稱"
    ];

    let currentVerifiedCode = "";
    let availableStocks = [];

    // 💡 萬用跨網域 JSONP 通訊工具：徹底根除 ERR_NAME_NOT_RESOLVED 
    function jsonpRequest(url, params, callbackName, successCallback) {
        const callbackId = "jsonp_" + Date.now();
        window[callbackId] = function(data) {
            successCallback(data);
            delete window[callbackId];
            document.getElementById(callbackId).remove();
        };
        
        let queryString = `?callback=${callbackId}`;
        for (let key in params) {
            queryString += `&${key}=${encodeURIComponent(params[key])}`;
        }
        
        const script = document.createElement("script");
        script.id = callbackId;
        script.src = url + queryString;
        document.body.appendChild(script);
    }

    // 1. 點擊「確認解鎖轉盤」：連線後端驗證邀請碼與撈取最新庫存
    function verifyAndUnlock() {
        const codeInput = document.getElementById("luckCode").value.trim();
        if (codeInput.length !== 5) {
            alert("請輸入正確的 5 位數抽獎邀請碼！");
            return;
        }
        
        document.getElementById("statusText").innerText = "雲端安全連線中，請稍候... (กำลังตรวจสอบ...)";
        document.getElementById("unlockBtn").disabled = true;

        // 向 Google 發送驗證請求
        jsonpRequest(gasApiUrl, { code: codeInput }, "callback", function(response) {
            document.getElementById("unlockBtn").disabled = false;
            
            if (response.status === "valid") {
                currentVerifiedCode = codeInput;
                availableStocks = response.stocks || []; // 取得 Stock 分頁的目前剩餘數量
                document.getElementById("spinBtn").disabled = false;
                document.getElementById("statusText").innerText = "✅ 驗證成功！請點擊【抽獎】按鈕！";
                document.getElementById("luckCode").disabled = true;
            } else if (response.status === "used") {
                document.getElementById("statusText").innerText = `❌ 此邀請碼已於線上抽過獎！中獎品項為：【${response.prize}】`;
                alert(`此邀請碼已使用過！\n中獎品項：${response.prize}`);
            } else {
                document.getElementById("statusText").innerText = "❌ 找不到此邀請碼，請聯繫店員確認。";
                alert("錯誤：無效的邀請碼！");
            }
        });
    }

    // 2. 點擊「抽獎」：執行轉盤邏輯並過濾零庫存商品
    function startDraw() {
        document.getElementById("spinBtn").disabled = true;
        document.getElementById("statusText").innerText = "轉盤旋轉中... (กำลังสุ่มรางวัล...)";
        
        // 篩選出目前還有庫存（數量 > 0）的獎項索引
        let validIndexes = [];
        for (let i = 0; i < prizeList.length; i++) {
            // 如果後端有回傳庫存，且庫存大於 0，才納入抽獎池
            if (availableStocks[i] === undefined || availableStocks[i] > 0) {
                validIndexes.push(i);
            }
        }
        
        // 防呆：如果所有東西都沒庫存了，預設抽中最後一個或提示
        if (validIndexes.length === 0) {
            alert("本日獎品已全數抽完！請洽現場店員。");
            document.getElementById("statusText").innerText = "獎品已全數抽完。";
            return;
        }
        
        // 從有庫存的品項中隨機抽取一個
        const randomIndex = validIndexes[Math.floor(Math.random() * validIndexes.length)];
        const finalPrize = prizeList[randomIndex];

        // 模擬轉盤動畫延遲 2 秒後開獎
        setTimeout(() => {
            // 顯示中獎視覺效果
            document.getElementById("prizeName").innerText = "【" + finalPrize + "】";
            document.getElementById("rewardBox").style.display = "block";
            document.getElementById("statusText").innerText = "🎉 抽獎完成！紀錄已成功同步至雲端庫庫房。";
            
            // 🔥 核心：抽完獎當下，立刻發送請求，強制回填寫入試算表
            submitDrawResult(currentVerifiedCode, finalPrize);
        }, 2000);
    }

    // 3. 核心強制回填函數：將結果寫入試算表指定列
    function submitDrawResult(code, prize) {
        jsonpRequest(gasApiUrl, { code: code, prize: prize }, "callback", function(response) {
            if (response.status === "success") {
                console.log("試算表回填成功！欄位已自動更新為【已使用】與記錄獎項。");
            } else {
                console.error("回填失敗：", response.message);
            }
        });
    }
</script>

</body>
</html>
