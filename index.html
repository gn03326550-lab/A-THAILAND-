<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-THAILAND 18週年慶抽大獎</title>
    <style>
        /* 網頁整體奢華黑金視覺樣式 */
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            text-align: center; 
            background-color: #1a1a1a; 
            color: #f1f1f1; 
            padding: 20px; 
            margin: 0;
        }
        .container { 
            max-width: 480px; 
            margin: 40px auto; 
            background: #262626; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.6); 
            border: 1px solid #3d3d3d;
        }
        h1 { color: #d4af37; font-size: 24px; margin-bottom: 5px; }
        .subtitle { color: #aaa; font-size: 14px; margin-bottom: 25px; }
        
        /* 輸入框與按鈕設計 */
        input { 
            width: 85%; 
            padding: 12px; 
            margin: 10px 0; 
            font-size: 16px; 
            border-radius: 8px; 
            border: 1px solid #444; 
            background: #111; 
            color: #fff; 
            text-align: center; 
            letter-spacing: 2px;
        }
        input:focus { border-color: #d4af37; outline: none; }
        
        button { 
            width: 90%; 
            padding: 14px; 
            margin: 12px 0; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 8px; 
            border: none; 
            cursor: pointer; 
            transition: all 0.3s ease;
        }
        #unlockBtn { background: #d4af37; color: #111; }
        #unlockBtn:hover { background: #f3ca40; }
        
        #spinBtn { background: #e67e22; color: #fff; }
        #spinBtn:hover { background: #d35400; }
        #spinBtn:disabled { background: #444; color: #777; cursor: not-allowed; }
        
        /* 狀態提示 */
        .status { color: #ffcc00; font-size: 14px; margin: 15px 0; min-height: 20px; }
        
        /* 中獎彈窗區塊 */
        .reward-box { 
            display: none; 
            background: linear-gradient(135deg, #b8860b, #d4af37); 
            color: #000; 
            padding: 20px; 
            border-radius: 10px; 
            margin-top: 25px; 
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(212,175,55,0.4);
        }
        .reward-box h2 { margin: 0 0 10px 0; font-size: 22px; }
        .verify-text { font-size: 12px; color: #333; margin-top: 10px; border-top: 1px dashed #666; padding-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎁 A-THAILAND 18週年慶抽大獎 🎁</h1>
    <div class="subtitle">10 大好禮・即抽即中 / ของรางวัล 10 อย่าง จับสลากได้ทันที</div>
    
    <!-- 邀請碼輸入區 -->
    <input type="text" id="luckCode" placeholder="請輸入您的 5 位數抽獎邀請碼" maxlength="5">
    <button id="unlockBtn" onclick="verifyAndUnlock()">確認解鎖轉盤 (ยืนยันเพื่อปลดล็oc)</button>
    
    <!-- 抽獎按鈕 -->
    <button id="spinBtn" onclick="startDraw()" disabled>抽獎 (หมุน)</button>
    
    <!-- 連線與進度提示 -->
    <div id="statusText" class="status"></div>
    
    <!-- 中獎結果顯示 -->
    <div id="rewardBox" class="reward-box">
        <h2>🥳 恭喜您中獎了！ ยินดีด้วย!</h2>
        <div id="prizeName" style="font-size: 24px; padding: 10px 0;"></div>
        <div class="verify-text">※ 本活動為購買達標顧客限定，請將中獎畫面出示給店員以利兌獎核銷。<br>※ โปรดแสดงหน้าจอนี้ให้พนักงานดูเพื่อรับรางวัล</div>
    </div>
</div>

    <script>
    // 🔗 您的專屬 Google Apps Script API 網址
    const gasApiUrl = "https://google.com";
    
    // 🎁 完美對齊海報與試算表（1 至 10 號真實商品）
    const prizeList = [
        "Redmi Headphone Neo (藍芽耳機罩)",
        "xdobo X8 II Bluetooth Speaker (喇叭X8二代)",
        "Xiaomi Bluetooth Speaker Essential (小米藍芽喇叭)",
        "Xiaomi Power Bank 10000 22.5W Lite (小米行動電源)",
        "Ronever Travel Speaker IPX4 Waterproof (羅納多喇叭)",
        "ANC Wireless Earbuds (藍芽耳機入耳)",
        "G'FIVE Wireless Power Bank QC3.0+PD (G'FIVE行動電源)",
        "REMAX RPP-145 10000mAh (REMAX行動電源)",
        "卡通造型行動電源 10000mAh",
        "ANFAST Small in Size Big in Power 5000mAh+ (UPS行動電源)"
    ];

    let currentVerifiedCode = "";
    let availableStocks = [];

    // 1. 點擊「確認解鎖轉盤」：驗證邀請碼與撈取最新庫存
    function verifyAndUnlock() {
        const codeInput = document.getElementById("luckCode").value.trim();
        if (codeInput.length !== 5) {
            alert("請輸入正確的 5 位數抽獎邀請碼！");
            return;
        }
        
        document.getElementById("statusText").innerText = "雲端安全連線中，請稍候... (กำลังตรวจสอบ...)";
        document.getElementById("unlockBtn").disabled = true;

        const targetUrl = `${gasApiUrl}?code=${encodeURIComponent(codeInput)}`;

        fetch(targetUrl, { method: "GET", mode: "cors" })
        .then(response => response.json())
        .then(response => {
            document.getElementById("unlockBtn").disabled = false;
            
            if (response.status === "valid") {
                currentVerifiedCode = codeInput;
                availableStocks = response.stocks || []; 
                document.getElementById("spinBtn").disabled = false;
                document.getElementById("statusText").innerText = "✅ 驗證成功！請點擊【抽獎】按鈕！";
                document.getElementById("luckCode").disabled = true;
            } else if (response.status === "used") {
                document.getElementById("statusText").innerText = `❌ 此邀請碼已使用過！獎項：【${response.prize}】`;
                alert(`此邀請碼已使用過！\n中獎品項：${response.prize}`);
            } else {
                document.getElementById("statusText").innerText = "❌ 找不到此邀請碼，請聯繫店員。";
                alert("錯誤：無效的邀請碼！");
            }
        })
        .catch(error => {
            console.error("連線錯誤：", error);
            document.getElementById("unlockBtn").disabled = false;
            document.getElementById("statusText").innerText = "❌ 連線逾時，請確認試算表是否已發布或稍後再試。";
        });
    }

    // 2. 點擊「抽獎」：執行轉盤邏輯並過濾零庫存商品
    function startDraw() {
        document.getElementById("spinBtn").disabled = true;
        document.getElementById("statusText").innerText = "轉盤旋轉中... (กำลังสุ่มรางวัล...)";
        
        let validIndexes = [];
        for (let i = 0; i < prizeList.length; i++) {
            if (availableStocks[i] === undefined || availableStocks[i] > 0) {
                validIndexes.push(i);
            }
        }
        
        if (validIndexes.length === 0) {
            alert("本日獎品已全數抽完！請洽現場店員。");
            document.getElementById("statusText").innerText = "獎品已全數抽完。";
            return;
        }
        
        const randomIndex = validIndexes[Math.floor(Math.random() * validIndexes.length)];
        const finalPrize = prizeList[randomIndex];

        setTimeout(() => {
            document.getElementById("prizeName").innerText = "【" + finalPrize + "】";
            document.getElementById("rewardBox").style.display = "block";
            document.getElementById("statusText").innerText = "🎉 抽獎完成！正在將紀錄同步至雲端...";
            
            // 觸發強制回填
            submitDrawResult(currentVerifiedCode, finalPrize);
        }, 2000);
    }

    // 3. 核心強制回填函數
    function submitDrawResult(code, prize) {
        const targetUrl = `${gasApiUrl}?code=${encodeURIComponent(code)}&prize=${encodeURIComponent(prize)}`;
        
        fetch(targetUrl, { method: "GET", mode: "cors" })
        .then(response => response.json())
        .then(response => {
            if (response.status === "success") {
                document.getElementById("statusText").innerText = "🎉 抽獎完成！紀錄已成功同步至試算表！";
                console.log("試算表回填成功！");
            }
        })
        .catch(error => {
            console.error("回填失敗：", error);
        });
    }
</script>

</body>
</html>
