<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ฉลองครบรอบ 18 ปี A-THAILAND / A-THAILAND 18周年慶祝抽獎活動</title>
  <style>
    :root {
      --primary-color: #d32f2f;
      --gold-color: #ffd700;
      --dark-gold: #b8860b;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Prompt', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: radial-gradient(circle, #2c0000 0%, #110000 100%);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: rgba(0, 0, 0, 0.6);
      border: 3px solid var(--gold-color);
      border-radius: 20px;
      padding: 30px 20px;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
      text-align: center;
      box-sizing: border-box;
      position: relative;
    }
    .lang-switch {
      position: absolute;
      top: 15px;
      right: 15px;
    }
    .lang-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--gold-color);
      color: #fff;
      padding: 5px 12px;
      font-size: 13px;
      cursor: pointer;
      border-radius: 15px;
      transition: all 0.2s;
    }
    .lang-btn.active {
      background: var(--gold-color);
      color: #000;
      font-weight: bold;
    }
    h1 {
      color: var(--gold-color);
      font-size: 2.2rem;
      margin-bottom: 5px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }
    .subtitle {
      font-size: 1.35rem; /* 稍微加大泰文字體 */
      color: #ffaaaa;
      margin-bottom: 25px;
      font-weight: bold;
      line-height: 1.4;
    }
    .prize-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 25px;
    }
    @media(min-width: 480px) {
      .prize-grid { grid-template-columns: repeat(5, 1fr); }
    }
    .prize-item {
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 8px 5px;
      font-size: 13.5px; /* 放大獎品名稱的泰文字 */
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 75px;
    }
    .prize-item .num {
      background: var(--gold-color);
      color: #000;
      font-weight: bold;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 5px;
      font-size: 12px;
    }
    .prize-item .name {
      word-break: break-word;
      line-height: 1.3;
    }
    .prize-item.active {
      background: rgba(211, 47, 47, 0.8);
      border-color: var(--gold-color);
      transform: scale(1.05);
      box-shadow: 0 0 15px var(--gold-color);
    }
    .input-group {
      margin-bottom: 20px;
    }
    input[type="text"] {
      width: 85%;
      max-width: 300px;
      padding: 12px 20px;
      font-size: 18px;
      border: 2px solid var(--gold-color);
      border-radius: 25px;
      background: #222;
      color: #fff;
      text-align: center;
      letter-spacing: 3px;
      outline: none;
    }
    input[type="text"]::placeholder {
      letter-spacing: 0px;
      font-size: 14.5px; /* 放大框內提示字 */
    }
    input[type="text"]:focus {
      box-shadow: 0 0 10px var(--gold-color);
    }
    .btn-draw {
      background: linear-gradient(135deg, #ff4500, #d32f2f);
      color: #fff;
      border: 2px solid var(--gold-color);
      padding: 12px 50px;
      font-size: 19px; /* 放大按鈕字體 */
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(211, 47, 47, 0.4);
      transition: all 0.2s ease;
    }
    .btn-draw:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 7px 20px rgba(255, 215, 0, 0.4);
    }
    .btn-draw:disabled {
      background: #555;
      border-color: #888;
      cursor: not-allowed;
    }
    .result-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 999;
      justify-content: center;
      align-items: center;
    }
    .result-box {
      background: linear-gradient(135deg, #2c0000, #5c0000);
      border: 4px solid var(--gold-color);
      border-radius: 20px;
      padding: 40px 20px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .result-title {
      color: var(--gold-color);
      font-size: 25px; /* 放大標題 */
      font-weight: bold;
      margin-bottom: 15px;
    }
    .result-prize {
      font-size: 21px; /* 放大中獎結果字體 */
      color: #fff;
      background: rgba(255,255,255,0.1);
      padding: 15px;
      border-radius: 10px;
      border: 1px dashed var(--gold-color);
      margin-bottom: 25px;
    }
    .btn-close {
      background: var(--gold-color);
      color: #000;
      border: none;
      padding: 10px 30px;
      font-size: 17px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 切換語言按鈕 -->
    <div class="lang-switch">
      <button id="btnTh" class="lang-btn active" onclick="switchLanguage('th')">ไทย</button>
      <button id="btnZh" class="lang-btn" onclick="switchLanguage('zh')">中文</button>
    </div>

    <h1>A-THAILAND</h1>
    <div class="subtitle" id="textSubtitle">🎉 ฉลองครบรอบ 18 ปี จับฉลากครั้งใหญ่ 🎉</div>
    
    <div class="prize-grid" id="prizeGrid"></div>

    <div class="input-group">
      <input type="text" id="inviteCode" placeholder="กรุณาใส่รหัสจับฉลาก 5 หลักของคุณ" autocomplete="off" inputmode="numeric" pattern="[0-9]*">
    </div>
    
    <button class="btn-draw" id="drawBtn" onclick="startLuckyDraw()">จับฉลากเลย</button>
  </div>

  <div class="result-overlay" id="resultOverlay">
    <div class="result-box">
      <div class="result-title" id="textResultTitle">ยินดีด้วย คุณได้รับรางวัล! 🎁</div>
      <div class="result-prize" id="resultPrizeName">奖品名称</div>
      <button class="btn-close" id="textBtnClose" onclick="closeResult()">ยอดเยี่ยมมาก</button>
    </div>
  </div>
<script>
  // 您的 Google Apps Script 網頁應用程式網址
  const scriptUrl = "https://script.google.com/macros/s/AKfycbyrZAU8dwZnK28pYszpe4D9ppVctznGWhTD_C3mZrYgji99jmJIn5n6nopJgINkBZTE/exec";

  // 【已修改】預設語系改為泰文 'th'
  let currentLang = 'th';

  const i18n = {
    zh: {
      subtitle: "🎉 歡慶 18 周年大抽獎 🎉",
      placeholder: "請輸入您的５位數抽獎邀請碼",
      drawBtn: "點我抽獎",
      resultTitle: "恭喜您中獎了！ 🎁",
      btnClose: "太棒了",
      alertEmpty: "請先輸入您的邀請碼！",
      alertFail: "抽獎失敗：\n",
      alertError: "系統連線錯誤，請確認網路連線或稍後再試！"
    },
    th: {
      subtitle: "🎉 ฉลองครบรอบ 18 ปี จับฉลากครั้งใหญ่ 🎉",
      placeholder: "กรุณาใส่รหัสจับฉลาก 5 หลักของคุณ",
      drawBtn: "จับฉลากเลย",
      resultTitle: "ยินดีด้วย คุณได้รับรางวัล! 🎁",
      btnClose: "ยอดเยี่ยมมาก",
      alertEmpty: "กรุณาใส่รหัสจับฉลากของคุณก่อน!",
      alertFail: "จับรางวัลไม่สำเร็จ:\n",
      alertError: "ระบบขัดข้อง กรุณาตรวจสอบอินเทอร์เน็ตหรือลองใหม่อีกครั้ง!"
    }
  };

  const prizes = [
    { id: 1, zh: "1.Redmi Headphone Neo", th: "1.Redmi Headphone Neo" },
    { id: 2, zh: "2.xdobo X8 II 藍牙喇叭", th: "2.xdobo X8 II" },
    { id: 3, zh: "3.Xiaomi 藍牙喇叭", th: "3.Xiaomi Speaker Essential" },
    { id: 4, zh: "4.Xiaomi 行動電源 10000", th: "4.Xiaomi Power Bank 10000" },
    { id: 5, zh: "5.Ronever 防水喇叭", th: "5.Ronever Speaker IPX4" },
    { id: 6, zh: "6.ANC 無線藍牙耳機", th: "6.ANC Wireless Earbuds" },
    { id: 8, zh: "8.G'FIVE 行動電源", th: "8.G'FIVE Power Bank" },
    { id: 9, zh: "9.REMAX 行動電源", th: "9.REMAX Power Bank" },
    { id: 7, zh: "7.卡通造型行動電源", th: "7.พาวเวอร์แบงค์ลายการ์ตูน" },
    { id: 10, zh: "10.ANFAST 行動電源", th: "10.ANFAST Power Bank" }
  ];

  function renderUI() {
    document.getElementById('textSubtitle').innerText = i18n[currentLang].subtitle;
    document.getElementById('inviteCode').placeholder = i18n[currentLang].placeholder;
    document.getElementById('drawBtn').innerText = i18n[currentLang].drawBtn;
    document.getElementById('textResultTitle').innerText = i18n[currentLang].resultTitle;
    document.getElementById('textBtnClose').innerText = i18n[currentLang].btnClose;

    const prizeGrid = document.getElementById('prizeGrid');
    prizeGrid.innerHTML = '';
    prizes.forEach(prize => {
      const div = document.createElement('div');
      div.className = 'prize-item';
      div.id = `prize-${prize.id}`;
      const displayName = currentLang === 'zh' ? prize.zh : prize.th;
      div.innerHTML = `<span class="num">${prize.id}</span><span class="name">${displayName}</span>`;
      prizeGrid.appendChild(div);
    });
  }

  function switchLanguage(lang) {
    currentLang = lang;
    document.getElementById('btnZh').classList.toggle('active', lang === 'zh');
    document.getElementById('btnTh').classList.toggle('active', lang === 'th');
    renderUI();
  }

  // 執行初始化（此時會直接加載泰文）
  renderUI();

  let animationInterval;

  async function startLuckyDraw() {
    const codeInput = document.getElementById('inviteCode');
    const drawBtn = document.getElementById('drawBtn');
    const code = codeInput.value.trim();

    if (!code) {
      alert(i18n[currentLang].alertEmpty);
      return;
    }

    drawBtn.disabled = true;
    codeInput.disabled = true;

    startGlowAnimation();

    try {
      const response = await fetch(`${scriptUrl}?code=${encodeURIComponent(code)}`);
      const data = await response.json();

      clearInterval(animationInterval);

      if (data.status === "success") {
        const matchedPrize = prizes.find(p => data.prize.toLowerCase().includes(p.zh.toLowerCase()) || data.prize.toLowerCase().includes(p.th.toLowerCase()) || p.zh.toLowerCase().includes(data.prize.toLowerCase()));
        const targetId = matchedPrize ? matchedPrize.id : 1;
        const finalPrizeName = matchedPrize ? (currentLang === 'zh' ? matchedPrize.zh : matchedPrize.th) : data.prize;

        stopAtTarget(targetId, () => {
          document.getElementById('resultPrizeName').innerText = finalPrizeName;
          document.getElementById('resultOverlay').style.display = 'flex';
        });

      } else {
        resetInterface();
        alert(i18n[currentLang].alertFail + data.message);
      }

    } catch (error) {
      clearInterval(animationInterval);
      resetInterface();
      alert(i18n[currentLang].alertError);
      console.error(error);
    }
  }

  function startGlowAnimation() {
    let currentIndex = 0;
    animationInterval = setInterval(() => {
      document.querySelectorAll('.prize-item').forEach(el => el.classList.remove('active'));
      const currentPrizeEl = document.getElementById(`prize-${prizes[currentIndex].id}`);
      if (currentPrizeEl) currentPrizeEl.classList.add('active');
      currentIndex = (currentIndex + 1) % prizes.length;
    }, 100);
  }

  function stopAtTarget(targetId, callback) {
    let currentIndex = 0;
    let speed = 100;
    let steps = 0;
    const totalSteps = 15;

    function roll() {
      document.querySelectorAll('.prize-item').forEach(el => el.classList.remove('active'));
      currentIndex = (currentIndex % prizes.length);
      const currentId = prizes[currentIndex].id;
      document.getElementById(`prize-${currentId}`).classList.add('active');

      steps++;
      if (steps > totalSteps && currentId === targetId) {
        setTimeout(callback, 500);
      } else {
        if (steps > totalSteps - 4) {
          speed += 60;
        }
        currentIndex++;
        setTimeout(roll, speed);
      }
    }
    roll();
  }

  function closeResult() {
    document.getElementById('resultOverlay').style.display = 'none';
    resetInterface();
  }

  function resetInterface() {
    document.getElementById('drawBtn').disabled = false;
    document.getElementById('inviteCode').disabled = false;
    document.getElementById('inviteCode').value = "";
    document.querySelectorAll('.prize-item').forEach(el => el.classList.remove('active'));
  }
</script>
</body>
</html>
